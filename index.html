<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آزمون ریاضی ششم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazir', sans-serif; }
        body { background: linear-gradient(135deg, #4facfe, #00f2fe); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 48px; padding: 30px 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; }
        h1 { color: #ff8c00; font-size: 2rem; margin-bottom: 10px; }
        .sub { color: #2c3e66; margin-bottom: 30px; border-bottom: 2px dashed #ffb347; display: inline-block; padding-bottom: 8px; }
        .question-card { background: #fff7ed; border-radius: 32px; padding: 20px; margin-bottom: 30px; text-align: right; }
        .question-text { font-size: 1.3rem; font-weight: bold; background: #ffefcf; padding: 12px 18px; border-radius: 28px; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { display: flex; align-items: center; gap: 12px; background: white; padding: 8px 16px; border-radius: 60px; border: 1px solid #ffd9a5; cursor: pointer; }
        input[type="radio"] { width: 18px; height: 18px; accent-color: #ff8c42; cursor: pointer; }
        label { font-size: 1rem; cursor: pointer; width: 100%; }
        .btn-submit, .btn-start, .btn-teacher, .btn-excel { display: block; width: 100%; background: linear-gradient(95deg, #ff9a3c, #ff6a00); border: none; padding: 14px; border-radius: 50px; font-size: 1.3rem; font-weight: bold; color: white; cursor: pointer; margin: 15px 0; }
        .btn-teacher { background: linear-gradient(95deg, #6a11cb, #2575fc); }
        .btn-excel { background: linear-gradient(95deg, #11998e, #38ef7d); }
        .result-box { background: #e6f7e6; border-radius: 40px; padding: 15px; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .correct { background: #2e7d32; color: white; padding: 6px 15px; border-radius: 60px; }
        .wrong { background: #d32f2f; color: white; padding: 6px 15px; border-radius: 60px; }
        .score-text { background: #ffb74d; padding: 6px 15px; border-radius: 60px; }
        .input-group { margin: 15px 0; text-align: right; }
        .input-group input { width: 100%; padding: 10px; font-size: 1rem; border: 2px solid #ffd9a5; border-radius: 30px; text-align: center; }
        .error { color: #d32f2f; font-size: 0.8rem; display: none; margin-top: 5px; }
        .student-item { background: #f8f9fa; border-radius: 20px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .student-score { background: #ff8c42; color: white; padding: 4px 12px; border-radius: 30px; }
        .back-btn { background: #6c757d; margin-top: 10px; }
        .student-list { max-height: 400px; overflow-y: auto; margin: 15px 0; }
        .emoji-big { font-size: 3rem; }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <!-- صفحه اصلی -->
    <div id="homeSection">
        <div class="emoji-big">📚🧸</div>
        <h1>آزمون ریاضی ششم</h1>
        <div class="sub">پایه دبستان</div>
        <button class="btn-start" id="studentEntryBtn">🧑‍🎓 ورود دانش‌آموز</button>
        <button class="btn-teacher" id="teacherEntryBtn">👨‍🏫 ورود معلم</button>
    </div>

    <!-- ثبت نام دانش‌آموز -->
    <div id="infoSection" style="display: none;">
        <div class="emoji-big">📝🧑‍🎓</div>
        <h1>ثبت نام</h1>
        <div class="input-group"><label>نام و نام خانوادگی:</label><input type="text" id="fullName"><div class="error" id="nameError">لطفاً نام را وارد کنید</div></div>
        <div class="input-group"><label>کد ملی (۱۰ رقم):</label><input type="text" id="nationalCode" maxlength="10"><div class="error" id="codeError">کد ملی باید ۱۰ رقم باشد</div></div>
        <button class="btn-start" id="saveInfoBtn">✅ ثبت و ادامه</button>
        <button class="back-btn btn-start" id="backHomeFromInfo">🔙 بازگشت</button>
    </div>

    <!-- خوش‌آمدگویی -->
    <div id="welcomeSection" style="display: none;">
        <div class="emoji-big">🧸✨</div>
        <h1>سلام <span id="displayName"></span>!</h1>
        <div class="sub">آزمون ریاضی ششم</div>
        <button class="btn-start" id="startExamBtn">🚀 شروع آزمون</button>
        <button class="back-btn btn-start" id="backHomeFromWelcome">🔙 بازگشت</button>
    </div>

    <!-- آزمون -->
    <div id="examSection" style="display: none;">
        <h1>🧮 آزمون ریاضی</h1>
        <div id="questions-container"></div>
        <button class="btn-submit" id="submitBtn">📋 ثبت پاسخ‌ها</button>
        <div id="resultArea" class="result-box" style="display: none;"></div>
        <button class="back-btn btn-start" id="backHomeFromExam">🔙 بازگشت</button>
    </div>

    <!-- پنل معلم -->
    <div id="teacherPanel" style="display: none;">
        <div class="emoji-big">👨‍🏫📊</div>
        <h1>پنل معلم</h1>
        <div class="input-group"><label>کد ملی معلم:</label><input type="password" id="teacherCode" maxlength="10"><div class="error" id="teacherError">کد اشتباه است</div><button class="btn-teacher" id="loginTeacherBtn">ورود</button></div>
        <div id="teacherDataSection" style="display: none;">
            <div class="student-list" id="studentListContainer"></div>
            <button class="btn-excel" id="exportExcelBtn">📎 خروجی Excel</button>
            <button class="btn-submit" id="clearScoresBtn" style="background:#d32f2f;">🗑️ پاک کردن همه نمرات</button>
            <button class="back-btn btn-start" id="logoutTeacherBtn">خروج</button>
        </div>
        <button class="back-btn btn-start" id="backHomeFromTeacher">🔙 بازگشت</button>
    </div>
</div>

<script>
const questions = [
    { text: "حاصل ۱۲ × ۸ چند است؟", options: ["۸۴", "۹۶", "۱۰۸", "۱۱۲"], correct: 1 },
    { text: "کسر ۳/۴ معادل کدام عدد اعشاری است؟", options: ["۰٫۲۵", "۰٫۵", "۰٫۷۵", "۱٫۲۵"], correct: 2 },
    { text: "مساحت مستطیل ۷ و ۴ سانتی‌متر؟", options: ["۱۸", "۲۲", "۲۸", "۳۲"], correct: 2 },
    { text: "حاصل ۲۵% از ۲۰۰؟", options: ["۲۵", "۵۰", "۷۵", "۱۰۰"], correct: 1 },
    { text: "کدام بزرگتر است؟", options: ["۰٫۴", "۳۵%", "۰٫۳۵", "۰٫۵"], correct: 3 }
];

const TEACHER_CODE = "1234567890";
let examSubmitted = false;
let userInfo = null;

function getScores() { return JSON.parse(localStorage.getItem('mathScores') || '[]'); }
function saveScores(scores) { localStorage.setItem('mathScores', JSON.stringify(scores)); }

function addScore(name, code, score, total) {
    let scores = getScores();
    scores.push({ name, code, score, total, date: new Date().toLocaleString('fa-IR') });
    saveScores(scores);
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    if(!container) return;
    container.innerHTML = '';
    questions.forEach((q, idx) => {
        let html = `<div class="question-card"><div class="question-text">${idx+1}. ${q.text}</div><div class="options">`;
        q.options.forEach((opt, optIdx) => {
            html += `<div class="option"><input type="radio" name="q${idx}" value="${optIdx}" id="q${idx}_${optIdx}"><label for="q${idx}_${optIdx}">${opt}</label></div>`;
        });
        html += `</div></div>`;
        container.innerHTML += html;
    });
    document.querySelectorAll('.option').forEach(div => {
        div.addEventListener('click', function() { if(!examSubmitted) this.querySelector('input').checked = true; });
    });
}

function disableOptions() {
    document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
    document.querySelectorAll('.option').forEach(o => { o.style.opacity = '0.6'; o.style.pointerEvents = 'none'; });
}

function showResult() {
    if(examSubmitted) return;
    let correct = 0;
    for(let i=0; i<questions.length; i++) {
        let selected = document.querySelector(`input[name="q${i}"]:checked`);
        if(selected && parseInt(selected.value) === questions[i].correct) correct++;
    }
    let wrong = questions.length - correct;
    document.getElementById('resultArea').style.display = 'flex';
    document.getElementById('resultArea').innerHTML = `<div class="correct">✅ درست: ${correct}</div><div class="wrong">❌ غلط: ${wrong}</div><div class="score-text">🎯 نمره: ${correct} از ${questions.length}</div>`;
    if(userInfo) addScore(userInfo.name, userInfo.code, correct, questions.length);
    document.getElementById('submitBtn').disabled = true;
    disableOptions();
    examSubmitted = true;
}

function startExam() {
    document.getElementById('welcomeSection').style.display = 'none';
    document.getElementById('examSection').style.display = 'block';
    renderQuestions();
    examSubmitted = false;
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('resultArea').style.display = 'none';
    document.querySelectorAll('.option').forEach(o => { o.style.opacity = '1'; o.style.pointerEvents = 'auto'; });
}

function saveUserInfo() {
    let name = document.getElementById('fullName').value.trim();
    let code = document.getElementById('nationalCode').value.trim();
    if(!name) { document.getElementById('nameError').style.display = 'block'; return; }
    if(!/^\d{10}$/.test(code)) { document.getElementById('codeError').style.display = 'block'; return; }
    userInfo = { name, code };
    document.getElementById('displayName').innerText = name;
    document.getElementById('infoSection').style.display = 'none';
    document.getElementById('welcomeSection').style.display = 'block';
}

function showTeacherPanel() {
    document.getElementById('homeSection').style.display = 'none';
    document.getElementById('teacherPanel').style.display = 'block';
    document.getElementById('teacherLoginSection').style.display = 'block';
    document.getElementById('teacherDataSection').style.display = 'none';
}

function loginTeacher() {
    if(document.getElementById('teacherCode').value === TEACHER_CODE) {
        document.getElementById('teacherLoginSection').style.display = 'none';
        document.getElementById('teacherDataSection').style.display = 'block';
        displayScores();
    } else { document.getElementById('teacherError').style.display = 'block'; }
}

function displayScores() {
    let scores = getScores();
    let container = document.getElementById('studentListContainer');
    if(scores.length === 0) { container.innerHTML = '<div class="empty-list">📭 هنوز نمره‌ای ثبت نشده</div>'; return; }
    container.innerHTML = '<div style="margin-bottom:10px; font-weight:bold;">📋 لیست نمرات</div>';
    [...scores].reverse().forEach(s => {
        container.innerHTML += `<div class="student-item"><div><b>${s.name}</b><br><small>کد: ${s.code} | ${s.date}</small></div><div class="student-score">${s.score} از ${s.total}</div></div>`;
    });
}

function exportExcel() {
    let scores = getScores();
    let csv = "نام,کد ملی,نمره,نمره کل,تاریخ\n";
    scores.forEach(s => { csv += `"${s.name}","${s.code}",${s.score},${s.total},"${s.date}"\n`; });
    let blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "نمرات_آزمون.csv";
    link.click();
}

function clearScores() {
    if(confirm("آیا از پاک کردن همه نمرات مطمئنی؟")) {
        localStorage.removeItem('mathScores');
        displayScores();
    }
}

function showHome() {
    document.getElementById('homeSection').style.display = 'block';
    document.getElementById('infoSection').style.display = 'none';
    document.getElementById('welcomeSection').style.display = 'none';
    document.getElementById('examSection').style.display = 'none';
    document.getElementById('teacherPanel').style.display = 'none';
    userInfo = null;
    examSubmitted = false;
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('studentEntryBtn').onclick = () => { document.getElementById('homeSection').style.display = 'none'; document.getElementById('infoSection').style.display = 'block'; };
    document.getElementById('teacherEntryBtn').onclick = showTeacherPanel;
    document.getElementById('saveInfoBtn').onclick = saveUserInfo;
    document.getElementById('startExamBtn').onclick = startExam;
    document.getElementById('submitBtn').onclick = showResult;
    document.getElementById('loginTeacherBtn').onclick = loginTeacher;
    document.getElementById('logoutTeacherBtn').onclick = () => { document.getElementById('teacherLoginSection').style.display = 'block'; document.getElementById('teacherDataSection').style.display = 'none'; };
    document.getElementById('exportExcelBtn').onclick = exportExcel;
    document.getElementById('clearScoresBtn').onclick = clearScores;
    document.getElementById('backHomeFromInfo').onclick = showHome;
    document.getElementById('backHomeFromWelcome').onclick = showHome;
    document.getElementById('backHomeFromExam').onclick = showHome;
    document.getElementById('backHomeFromTeacher').onclick = showHome;
    document.getElementById('nationalCode').oninput = function(e) { this.value = this.value.replace(/[^0-9]/g, ''); };
    document.getElementById('teacherCode').oninput = function(e) { this.value = this.value.replace(/[^0-9]/g, ''); };
    showHome();
});
</script>
</body>
</html>
